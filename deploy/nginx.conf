# Platform: diwan.io, admin.diwan.io and every company on *.diwan.io
server {
    listen 80;
    server_name diwan.io *.diwan.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name diwan.io *.diwan.io;
    root /var/www/diwan/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/diwan.io/fullchain.pem;   # wildcard certificate
    ssl_certificate_key /etc/letsencrypt/live/diwan.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|webp)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }
}

# Verified customer domains (CNAME to their subdomain). Terminate TLS per
# domain (e.g. certbot HTTP-01) or put Caddy with on-demand TLS in front.
server {
    listen 443 ssl http2 default_server;
    server_name _;
    root /var/www/diwan/public;
    ssl_certificate     /etc/ssl/custom-domains/default.pem;
    ssl_certificate_key /etc/ssl/custom-domains/default.key;
    # Unknown hosts are also rejected by the app (TENANCY_REJECT_UNKNOWN_HOSTS); only
    # verified custom domains get a page. Hidden files are never served.
    location ~ /\.(?!well-known) { deny all; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
