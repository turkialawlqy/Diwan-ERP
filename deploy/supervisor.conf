[program:diwan-zatca]
command=php /var/www/diwan/artisan queue:work redis --queue=zatca --sleep=1 --tries=6 --max-time=3600
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www-data
stopwaitsecs=120
stdout_logfile=/var/log/diwan/zatca.log

[program:diwan-default]
command=php /var/www/diwan/artisan queue:work redis --queue=default,webhooks --sleep=1 --tries=5 --max-time=3600
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/diwan/queue.log

[program:diwan-exports]
command=php /var/www/diwan/artisan queue:work redis-long --queue=exports --timeout=3600 --tries=1
numprocs=1
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/diwan/exports.log

; Laravel scheduler: backups, ZATCA resubmission, recurring entries, depreciation,
; provisions, alerts. Without it none of these run.
[program:diwan-scheduler]
command=php /var/www/diwan/artisan schedule:work
numprocs=1
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/diwan/scheduler.log
