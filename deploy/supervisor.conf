[program:alostaz-zatca]
command=php /var/www/alostaz/artisan queue:work redis --queue=zatca --sleep=1 --tries=6 --max-time=3600
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www-data
stopwaitsecs=120
stdout_logfile=/var/log/alostaz/zatca.log

[program:alostaz-default]
command=php /var/www/alostaz/artisan queue:work redis --queue=default,webhooks --sleep=1 --tries=5 --max-time=3600
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/alostaz/queue.log

[program:alostaz-exports]
command=php /var/www/alostaz/artisan queue:work redis --queue=exports --timeout=3600 --tries=1
numprocs=1
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/alostaz/exports.log
