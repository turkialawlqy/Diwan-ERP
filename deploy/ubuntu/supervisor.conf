; «الديوان» background processes for a small server (one worker per queue).
; Installed by deploy/ubuntu/install.sh into /etc/supervisor/conf.d/diwan.conf.

[group:diwan]
programs=diwan-zatca,diwan-default,diwan-exports,diwan-scheduler

[program:diwan-zatca]
command=php __APP_DIR__/artisan queue:work redis --queue=zatca --sleep=2 --tries=6 --max-time=3600 --memory=128
autostart=true
autorestart=true
user=www-data
stopwaitsecs=120
stdout_logfile=/var/log/diwan/zatca.log
redirect_stderr=true

[program:diwan-default]
command=php __APP_DIR__/artisan queue:work redis --queue=default,webhooks --sleep=2 --tries=5 --max-time=3600 --memory=128
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/diwan/queue.log
redirect_stderr=true

[program:diwan-exports]
command=php __APP_DIR__/artisan queue:work redis-long --queue=exports --timeout=3600 --tries=1 --memory=256
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/diwan/exports.log
redirect_stderr=true

; Scheduler: backups, ZATCA resubmission, recurring entries, depreciation, alerts.
[program:diwan-scheduler]
command=php __APP_DIR__/artisan schedule:work
autostart=true
autorestart=true
user=www-data
stdout_logfile=/var/log/diwan/scheduler.log
redirect_stderr=true
